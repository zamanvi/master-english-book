<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    overflow: hidden;
    position: relative;
  }
  .content { padding: 70px 80px; }
  .title {
    font-size: 56px;
    font-weight: 800;
    line-height: 1.15;
    margin-bottom: 20px;
  }

    font-size: 32px;
    color: #e0e7ff;
    font-weight: 600;
    margin-bottom: 40px;
  }
  .features {
    background: rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 30px 40px;
    width: 1040px;
  }
  .feature {
    font-size: 27px;
    font-weight: 700;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
  }
  .feature:last-child { margin-bottom: 0; }
  .check { color: #4ade80; margin-right: 14px; font-size: 27px; }
  .footer {
    position: absolute;
    bottom: 36px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 24px;
    color: rgba(255,255,255,0.9);
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="content">
    <div class="title"><span class="warn">⚠️</span>Free OSHA Safety Briefing<br>&amp; Sign-In Sheet Generator</div>
    <div class="tagline">Generate in 30 Seconds &middot; 100% Free PDF</div>
    <div class="features">
      <div class="feature"><span class="check">✓</span> OSHA Compliant (29 CFR 1904)</div>
      <div class="feature"><span class="check">✓</span> Instantly Generate &amp; Download PDF</div>
      <div class="feature"><span class="check">✓</span> 7 Pre-Built Safety Topics</div>
      <div class="feature"><span class="check">✓</span> Print or Email Ready</div>
    </div>
  </div>
  <div class="footer">masterenglishbook.com/international/osha-safety-tool</div>
</body>
</html>
